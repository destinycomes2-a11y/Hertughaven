function trackEvent(type, data={}) {
  const ev=storage.get("hh_events",[]); ev.push({type,data,ts:Date.now(),date:new Date().toISOString().split("T")[0]});
  if(ev.length>2000)ev.splice(0,ev.length-2000); storage.set("hh_events",ev);
}

async function callClaude(messages, role) {
  const sp = SYSTEM_PROMPT.replace("{ROLE}", role);
  const res = await fetch("https://holy-sound-c182.destinycomes2.workers.dev", {

    body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1000,system:sp,messages}),
  });
  const data = await res.json();
  return data.content?.map(b=>b.text||"").join("") || "Fejl: Intet svar modtaget.";
}

const td = new Date(); td.setHours(0,0,0,0);
const isExp = d => d && new Date(d)<td;
const isSoon = d => { if(!d)return false; const diff=(new Date(d)-td)/86400000; return diff>=0&&diff<=60; };
const fmtDate = d => d ? new Date(d).toLocaleDateString("da-DK",{day:"numeric",month:"short",year:"numeric"}) : "–";
const inits = n => n.split(" ").map(p=>p[0]).join("").slice(0,2).toUpperCase();
const cSt = (ok,exp) => !ok?"none":isExp(exp)?"expired":isSoon(exp)?"soon":"ok";
const SC = {ok:"#00897B",soon:"#F57C00",expired:"#D32F2F",none:"#90A4AE"};
const SL = {ok:"Godkendt",soon:"Udløber snart",expired:"Udløbet",none:"Ikke godkendt"};

function Badge({approved,expiry}) {
  const st=cSt(approved,expiry),c=SC[st];
  return <span style={{fontSize:11,fontFamily:"'JetBrains Mono',monospace",fontWeight:600,padding:"4px 10px",borderRadius:4,background:c+"20",color:c,border:`1px solid ${c}40`,whiteSpace:"nowrap"}}>{SL[st]}</span>;
}

  });
  const toggle=id=>setDraft(p=>({...p,[id]:{...p[id],approved:!p[id].approved}}));
  const setExp=(id,v)=>setDraft(p=>({...p,[id]:{...p[id],expiry:v}}));
  const save=()=>{const r={};DEPOT_DRUGS.forEach(d=>{if(draft[d.id].approved)r[d.id]={approved:true,expiry:draft[d.id].expiry||null};});onSave(staffMember.id,r);};

// ─── Depot Module ─────────────────────────────────────────────────────────────
function DepotModule({onClose,activeRole}) {
  const [staff,setStaff]=useState(()=>storage.get("hh_staff",DEFAULT_STAFF));
  const [depotData,setDepotData]=useState(()=>storage.get("hh_depot_comp",DEFAULT_DEPOT));
  const [profileData,setProfileData]=useState(()=>storage.get("hh_profiles",{}));
  const [selected,setSelected]=useState(null);
  const [activeTab,setActiveTab]=useState("staff");
  const [query,setQuery]=useState("");
  const [drugQuery,setDrugQuery]=useState("");
  const [editDepot,setEditDepot]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);

  useEffect(()=>{storage.set("hh_staff",staff);},[staff]);
  useEffect(()=>{storage.set("hh_depot_comp",depotData);},[depotData]);
  useEffect(()=>{storage.set("hh_profiles",profileData);},[profileData]);

  const canEdit = activeRole==="Sygeplejerske";
  const addStaff = m => { setStaff(p=>[...p,m]); setShowAdd(false); setSelected(m.id); };
  const delStaff = id => { setStaff(p=>p.filter(s=>s.id!==id)); if(selected===id)setSelected(null); setConfirmDel(null); };
  const editStaff = m => setStaff(p=>p.map(s=>s.id===m.id?m:s));
  const saveDepot = (id,comp) => { setDepotData(p=>({...p,[id]:comp})); setEditDepot(null); };
  const updateProfile = (id,prof) => setProfileData(p=>({...p,[id]:prof}));

  const filtStaff = staff.filter(s=>s.name.toLowerCase().includes(query.toLowerCase())||s.role.toLowerCase().includes(query.toLowerCase()));
  const filtDrugs = DEPOT_DRUGS.filter(d=>d.name.toLowerCase().includes(drugQuery.toLowerCase())||d.generic.toLowerCase().includes(drugQuery.toLowerCase()));
  const selMember = staff.find(s=>s.id===selected);

  const getStats = id => {
    const comp=depotData[id]||{};
    const ok=Object.values(comp).filter(c=>c.approved&&!isExp(c.expiry)).length;
    const bad=Object.values(comp).filter(c=>c.approved&&(isExp(c.expiry)||isSoon(c.expiry))).length;
    const prof=profileData[id]||getBaseProfile((staff.find(s=>s.id===id)||{}).role);
    const flagged=Object.values(prof).filter(p=>p.flagged).length;
    return {ok,bad,flagged};
  };

  const tabBtn=(id,lbl)=>(
    <button onClick={()=>{setActiveTab(id);setSelected(null);}} style={{background:activeTab===id?"#FFFFFF":"rgba(255,255,255,0.15)",border:`1px solid ${activeTab===id?"#FFFFFF":"rgba(255,255,255,0.5)"}`,color:activeTab===id?"#1565C0":"#FFFFFF",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:600}}>
      {lbl}
    </button>
  );

  const exportData = () => {
    const data = { version:1, exported: new Date().toISOString(), staff, depotData, profileData };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `hertughaven-data-${new Date().toISOString().split("T")[0]}.json`;
    a.click();
  };

  const importData = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json";
    inp.onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if(data.staff) setStaff(data.staff);
          if(data.depotData) setDepotData(data.depotData);
          if(data.profileData) setProfileData(data.profileData);
          alert("Data indlaest!");
        } catch { alert("Fejl: Ugyldig fil."); }
      };
      reader.readAsText(file);
    };
    inp.click();
  };

  return (
    <div style={{position:"fixed",inset:0,background:"#E8EEF4",zIndex:300,display:"flex",flexDirection:"column",fontFamily:"'Crimson Pro',serif"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderBottom:"1px solid #0D47A1",background:"#1565C0",flexShrink:0,flexWrap:"wrap"}}>

            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>setConfirmDel(null)} style={{background:"none",border:"1px solid #C8D6E2",color:"#607D8B",borderRadius:8,padding:"9px 18px",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:15}}>Annuller</button>

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({onClose}) {
  const ev=storage.get("hh_events",[]);
  const sess=ev.filter(e=>e.type==="session_start"),msgs=ev.filter(e=>e.type==="message_sent"),tops=ev.filter(e=>e.type==="topic");
  const rc={};ROLES.forEach(r=>rc[r.id]=0);sess.forEach(e=>{if(e.data.role)rc[e.data.role]=(rc[e.data.role]||0)+1;});
  const now=new Date();
  const days=Array.from({length:14},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(13-i));return d.toISOString().split("T")[0];});
  const mpd=days.map(d=>({date:d,label:new Date(d).toLocaleDateString("da-DK",{weekday:"short",day:"numeric"}),count:msgs.filter(e=>e.date===d).length}));
  const tc={};tops.forEach(e=>{if(e.data.topic)tc[e.data.topic]=(tc[e.data.topic]||0)+1;});
  const tt=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const ts=sess.length,tm=msgs.length,avg=ts?(tm/ts).toFixed(1):0,ad=days.slice(7).filter(d=>msgs.some(e=>e.date===d)).length,mx=Math.max(...mpd.map(d=>d.count),1);
  return(
    <div style={{position:"fixed",inset:0,background:"#E8EEF4",zIndex:300,overflowY:"auto",fontFamily:"'Crimson Pro',serif"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 24px",borderBottom:"1px solid #C8D6E2",background:"#E8EEF4",position:"sticky",top:0,zIndex:10}}>
        <div>
          <div style={{fontSize:19,fontWeight:600,color:"#1A2332"}}>⚕️ Admin Dashboard</div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#90A4AE",textTransform:"uppercase",letterSpacing:"0.1em",marginTop:2}}>Hertughaven · Sønderborg Kommune</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{const b=new Blob([JSON.stringify({exportDate:new Date().toISOString(),ts,tm,rc,tt},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`hh-${new Date().toISOString().split("T")[0]}.json`;a.click();}}
            style={{background:"#1565C0",border:"1px solid #1565C0",color:"#1565C0",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:13}}>↓ Eksportér</button>
          <button onClick={onClose} style={{background:"#FFFFFF",border:"1px solid #C8D6E2",color:"#546E7A",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:13}}>← Tilbage</button>
        </div>
      </div>
      <div style={{padding:24,maxWidth:960,margin:"0 auto"}}>
        {ts===0?<div style={{textAlign:"center",padding:"60px 20px",color:"#90A4AE",fontStyle:"italic"}}>Ingen data endnu.</div>:<>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:24}}>
            {[{l:"Samtaler",v:ts,h:"siden opstart"},{l:"Beskeder",v:tm,h:"bruger + AI"},{l:"Pr. samtale",v:avg,h:"gennemsnit"},{l:"Aktive dage (7)",v:`${ad}/7`,h:""}].map(s=>(
              <div key={s.l} style={{background:"#FFFFFF",border:"1px solid #C8D6E2",borderRadius:12,padding:"16px 18px"}}>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#90A4AE",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:7}}>{s.l}</div>
                <div style={{fontSize:30,fontWeight:600,color:"#1565C0",lineHeight:1}}>{s.v}</div>
                {s.h&&<div style={{fontSize:12,color:"#78909C",marginTop:4,fontStyle:"italic"}}>{s.h}</div>}
              </div>
            ))}
          </div>
          <div style={{marginBottom:24}}>
            <div style={{fontSize:15,fontWeight:600,color:"#546E7A",marginBottom:12,paddingBottom:7,borderBottom:"1px solid #C8D6E2"}}>Aktivitet · 14 dage</div>
            <div style={{background:"#FFFFFF",border:"1px solid #C8D6E2",borderRadius:12,padding:"18px 14px"}}>
              <div style={{display:"flex",alignItems:"flex-end",gap:4,height:90}}>
                {mpd.map(d=>(
                  <div key={d.date} style={{display:"flex",flexDirection:"column",alignItems:"center",flex:1,height:"100%",justifyContent:"flex-end"}}>
                    {d.count>0&&<div style={{fontSize:9,color:"#1565C0",marginBottom:2,fontFamily:"'JetBrains Mono',monospace"}}>{d.count}</div>}
                    <div style={{width:"100%",borderRadius:"3px 3px 0 0",background:"linear-gradient(180deg,#42A5F5,#1565C0)",minHeight:2,height:`${(d.count/mx)*88}%`}}/>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"#90A4AE",marginTop:4,writingMode:"vertical-rl",transform:"rotate(180deg)",whiteSpace:"nowrap"}}>{d.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:20}}>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:"#546E7A",marginBottom:12,paddingBottom:7,borderBottom:"1px solid #C8D6E2"}}>Faggrupper</div>
              <div style={{background:"#FFFFFF",border:"1px solid #C8D6E2",borderRadius:12,padding:"12px 16px"}}>
                {ROLES.map(r=>{const c=rc[r.id]||0,mx2=Math.max(...Object.values(rc),1);return(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #C8D6E2"}}>
                    <span style={{fontSize:13}}>{r.icon}</span><span style={{fontSize:13,color:"#2C3E50",width:90}}>{r.id}</span>
                    <div style={{flex:1,height:5,background:"#D6E0EA",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${(c/mx2)*100}%`,background:"linear-gradient(90deg,#26A69A,#1976D2)",borderRadius:3}}/></div>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"#1976D2",width:18,textAlign:"right"}}>{c}</span>
                  </div>
                );})}
              </div>
            </div>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:"#546E7A",marginBottom:12,paddingBottom:7,borderBottom:"1px solid #C8D6E2"}}>Populære emner</div>
              {tt.length===0?<div style={{color:"#90A4AE",fontStyle:"italic",fontSize:14}}>Indsamles fra genvejsknapper</div>
                :tt.map(([t,c])=>(
                  <div key={t} style={{display:"flex",justifyContent:"space-between",padding:"7px 11px",borderRadius:8,marginBottom:5,background:"#FFFFFF",border:"1px solid #C8D6E2"}}>
                    <span style={{fontSize:13,color:"#2C3E50"}}>{t}</span>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,background:"#D6E0EA",color:"#1976D2",padding:"2px 7px",borderRadius:10}}>{c}×</span>
                  </div>
                ))}
            </div>
          </div>
          <div style={{background:"#FFFFFF",border:"1px solid #C8D6E2",borderRadius:12,padding:"12px 16px",fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"#90A4AE",lineHeight:1.7}}>
            <span style={{color:"#78909C"}}>ℹ️ GDPR:</span> Data gemmes lokalt i browseren. Ingen persondata eller samtaleindhold registreres.
          </div>
        </>}
      </div>
    </div>
  );
}

// ─── Admin Login ──────────────────────────────────────────────────────────────
function AdminLogin({onSuccess,onCancel}) {
  const [pw,setPw]=useState(""); const [err,setErr]=useState(false);
  const try2=()=>{if(pw===ADMIN_PASSWORD)onSuccess();else{setErr(true);setPw("");}};
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:250,backdropFilter:"blur(6px)"}}>
      <div style={{background:"#FFFFFF",border:"1px solid #C8D6E2",borderRadius:16,padding:34,width:310}}>
        <div style={{fontSize:24,textAlign:"center",marginBottom:8}}>🔒</div>
        <div style={{fontSize:18,fontWeight:600,color:"#1A2332",textAlign:"center",marginBottom:4}}>Admin adgang</div>
        <div style={{fontSize:13,color:"#607D8B",textAlign:"center",marginBottom:20,fontStyle:"italic"}}>Kun for daglig leder</div>
        <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr(false);}} onKeyDown={e=>e.key==="Enter"&&try2()} placeholder="Adgangskode..." autoFocus
          style={{width:"100%",background:"#E8EEF4",border:`1px solid ${err?"#D32F2F":"#C8D6E2"}`,borderRadius:8,padding:"9px 13px",color:"#1A2332",fontFamily:"'Crimson Pro',serif",fontSize:15,outline:"none",marginBottom:err?8:13}}/>
        {err&&<div style={{color:"#D32F2F",fontSize:12,marginBottom:10,textAlign:"center"}}>Forkert adgangskode</div>}
        <div style={{display:"flex",gap:9}}>
          <button onClick={onCancel} style={{flex:1,background:"none",border:"1px solid #C8D6E2",color:"#607D8B",borderRadius:8,padding:9,cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:14}}>Annuller</button>
          <button onClick={try2} style={{flex:1,background:"#1565C0",border:"1px solid #1565C0",color:"#1565C0",borderRadius:8,padding:9,cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:14}}>Log ind</button>
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [role,setRole]=useState(null);
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [showRoleModal,setShowRoleModal]=useState(false);
  const [showAdminLogin,setShowAdminLogin]=useState(false);
  const [showDashboard,setShowDashboard]=useState(false);
  const [showDepot,setShowDepot]=useState(false);
  const [selectedTopic,setSelectedTopic]=useState(null);
  const [topicSubmode,setTopicSubmode]=useState(null);
  const [quizCount,setQuizCount]=useState(null);
  const bottomRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{const r=storage.get("hh_role");if(r)setRole(r);},[]);
  useEffect(()=>{if(role){storage.set("hh_role",role);storage.set("hh_messages",messages);}},[role,messages]);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  const selectRole=r=>{
    setRole(r);setShowRoleModal(false);setSelectedTopic(null);setTopicSubmode(null);setQuizCount(null);setMessages([]);storage.set("hh_messages",[]);trackEvent("session_start",{role:r});
  };

  const sendMessage=async text=>{
    const ut=text||input.trim();if(!ut||loading)return;
    setInput("");trackEvent("message_sent",{role});
    const nm=[...messages,{role:"user",content:ut}];setMessages(nm);setLoading(true);
    try{const rep=await callClaude(nm.map(m=>({role:m.role,content:m.content})),role);setMessages([...nm,{role:"assistant",content:rep}]);}
    catch{setMessages([...nm,{role:"assistant",content:"⚠️ Fejl ved forbindelse. Prøv igen."}]);}
    setLoading(false);setTimeout(()=>inputRef.current?.focus(),100);
  };

  const hq=a=>{trackEvent("topic",{topic:a,role});sendMessage(a);};
  const clear=()=>{setMessages([]);storage.set("hh_messages",[]);setSelectedTopic(null);setTopicSubmode(null);setQuizCount(null);};
  const fmt=t=>t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/#{1,3} (.+)/g,'<span style="display:block;font-size:18px;font-weight:600;color:#1A2332;margin:8px 0 4px">$1</span>').replace(/\n- /g,"\n• ").replace(/\n/g,"<br/>");

  return(
    <div style={{minHeight:"100vh",background:"#F0F4F8",display:"flex",flexDirection:"column",color:"#1A2332",fontFamily:"'Crimson Pro',serif"}}>
      <style>{`
        .rp{display:flex;align-items:center;gap:7px;background:#FFFFFF;border:1px solid #C8D6E2;border-radius:20px;padding:5px 13px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:14px;color:#2C3E50;transition:all 0.2s;}
        .rp:hover{border-color:rgba(255,255,255,0.8);color:#FFFFFF;}
        .ib{background:#FFFFFF;border:1px solid #FFFFFF;color:#1565C0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;font-weight:600;}
        .ib:hover{background:#E3F2FD;border-color:#E3F2FD;}
        .db{background:#FFFFFF;border:1px solid #FFFFFF;color:#1565C0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;font-weight:600;}
        .db:hover{background:#E3F2FD;border-color:#E3F2FD;}
        .ab{background:#FFFFFF;border:1px solid #FFFFFF;color:#1565C0;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;font-weight:600;}
        .ab:hover{background:#E3F2FD;border-color:#E3F2FD;}
        .ab:hover{background:rgba(255,255,255,0.3);border-color:rgba(255,255,255,0.6);}
        .ro{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
        .rm{background:#FFFFFF;border:1px solid #C8D6E2;border-radius:16px;padding:34px;max-width:440px;width:90%;animation:fu 0.3s ease;}
        @keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .ro-opt{display:flex;align-items:center;gap:14px;background:#F0F4F8;border:1px solid #C8D6E2;border-radius:10px;padding:13px 16px;cursor:pointer;transition:all 0.2s;width:100%;text-align:left;margin-bottom:8px;}
        .ro-opt:hover{border-color:#1565C0;background:#E3F2FD;transform:translateX(4px);}
        .mr{display:flex;margin-bottom:18px;animation:fu 0.25s ease;}
        .mr.user{justify-content:flex-end;}
        .mb{max-width:80%;padding:13px 16px;border-radius:14px;font-family:'Crimson Pro',serif;font-size:16px;line-height:1.65;}
        .mb.user{background:#1565C0;border:1px solid #0D47A1;color:#FFFFFF;border-bottom-right-radius:4px;}
        .mb.assistant{background:#FFFFFF;border:1px solid #D0DAE4;color:#2C3E50;border-bottom-left-radius:4px;}
        .mb strong{color:#1565C0;font-weight:600;} .mb em{color:#546E7A;} .mb code{font-family:'JetBrains Mono',monospace;font-size:13px;background:#F0F4F8;padding:2px 6px;border-radius:4px;color:#1565C0;}
        .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#1565C0,#0D47A1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px;margin-right:9px;}
        .dot{width:7px;height:7px;border-radius:50%;background:#1565C0;animation:bo 1.2s infinite;display:inline-block;margin:0 2px;}
        .dot:nth-child(2){animation-delay:0.2s}.dot:nth-child(3){animation-delay:0.4s}
        @keyframes bo{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-6px);opacity:1}}
        .qb{background:#FFFFFF;border:1px solid #C8D6E2;color:#546E7A;border-radius:20px;padding:6px 13px;font-family:'Crimson Pro',serif;font-size:14px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
        .qb:hover{border-color:#1565C0;color:#1565C0;}
        .ci{flex:1;background:#FFFFFF;border:1px solid #C8D6E2;border-radius:12px;padding:11px 15px;color:#1A2332;font-family:'Crimson Pro',serif;font-size:16px;resize:none;min-height:46px;max-height:120px;outline:none;transition:border-color 0.2s;line-height:1.5;}
        .ci:focus{border-color:#1565C0;} .ci::placeholder{color:#607D8B;}
        .sb{background:#1565C0;border:1px solid #0D47A1;color:#FFFFFF;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:18px;transition:all 0.2s;height:46px;display:flex;align-items:center;}
        .sb:hover:not(:disabled){background:#0D47A1;} .sb:disabled{opacity:0.4;cursor:not-allowed;}
      `}</style>

      {(!role||showRoleModal)&&(
        <div className="ro">
          <div className="rm">
            <div style={{textAlign:"center",fontSize:32,marginBottom:10}}>⚕️</div>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:23,fontWeight:600,color:"#1A2332",textAlign:"center",marginBottom:6}}>Hertughaven</div>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:14,color:"#546E7A",textAlign:"center",marginBottom:22,fontStyle:"italic"}}>Faglig sparringspartner · Sønderborg Kommune</div>
            {ROLES.map(r=>(
              <button key={r.id} className="ro-opt" onClick={()=>selectRole(r.id)}>
                <span style={{fontSize:20}}>{r.icon}</span>
                <span style={{fontFamily:"'Crimson Pro',serif",fontSize:16,fontWeight:600,color:"#1A2332"}}>{r.label}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {showAdminLogin&&<AdminLogin onSuccess={()=>{setShowAdminLogin(false);setShowDashboard(true);}} onCancel={()=>setShowAdminLogin(false)}/>}
      {showDashboard&&<Dashboard onClose={()=>setShowDashboard(false)}/>}
      {showDepot&&<DepotModule onClose={()=>setShowDepot(false)} activeRole={role}/>}

      {/* Header */}
      <div style={{background:"#F0F4F8",borderBottom:"1px solid #D0DAE4",padding:"12px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:"linear-gradient(135deg,#1565C0,#0D47A1)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>⚕️</div>
          <div>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:18,fontWeight:600,color:"#1A2332"}}>Hertughaven</div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#607D8B",letterSpacing:"0.1em",textTransform:"uppercase"}}>Socialpsykiatri · Sønderborg</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          {role&&<button className="rp" onClick={()=>setShowRoleModal(true)}><span>{ROLES.find(r=>r.id===role)?.icon}</span><span>{role}</span></button>}
          <button className="db" onClick={()=>setShowDepot(true)}>💉 Depot</button>
          <button className="ib" onClick={clear}>↺ Ny</button>
          <button className="ab" onClick={()=>setShowAdminLogin(true)}>⚙ Admin</button>
        </div>
      </div>

      {/* Topic grid overlay */}
      {role&&messages.length===0&&!selectedTopic&&(
        <div style={{flex:1,overflowY:"auto",padding:"28px 18px",maxWidth:900,width:"100%",margin:"0 auto"}}>
          <div style={{textAlign:"center",marginBottom:28}}>
            <div style={{fontSize:40,marginBottom:10}}>{ROLES.find(r=>r.id===role)?.icon}</div>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,color:"#1A2332",marginBottom:4}}>Hvad vil du arbejde med?</div>
            <div style={{fontFamily:"'Crimson Pro',serif",fontSize:14,color:"#607D8B",fontStyle:"italic"}}>Vælg et emne for at komme i gang</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:14}}>
            {(TOPICS[role]||[]).map(t=>(
              <button key={t.id} onClick={()=>setSelectedTopic(t)}
                onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-3px)";e.currentTarget.style.boxShadow=`0 8px 24px ${t.color}30`;e.currentTarget.style.borderColor=t.color;}}
                onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.06)";e.currentTarget.style.borderColor=`${t.color}20`;}}
                style={{background:"#FFFFFF",border:`2px solid ${t.color}20`,borderRadius:14,padding:"22px 16px",cursor:"pointer",textAlign:"center",transition:"all 0.2s",display:"flex",flexDirection:"column",alignItems:"center",gap:10,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:36}}>{t.icon}</div>
                <div style={{fontFamily:"'Crimson Pro',serif",fontSize:15,fontWeight:600,color:"#1A2332",lineHeight:1.3}}>{t.label}</div>
                <div style={{width:32,height:3,borderRadius:2,background:t.color,opacity:0.7}}/>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Submode selector */}
      {role&&messages.length===0&&selectedTopic&&!topicSubmode&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"28px 18px"}}>
          <button onClick={()=>setSelectedTopic(null)} style={{alignSelf:"flex-start",marginBottom:20,background:"none",border:"none",color:"#607D8B",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:15,display:"flex",alignItems:"center",gap:6}}>← Tilbage</button>
          <div style={{fontSize:48,marginBottom:12}}>{selectedTopic.icon}</div>
          <div style={{fontFamily:"'Crimson Pro',serif",fontSize:22,fontWeight:600,color:"#1A2332",marginBottom:6}}>{selectedTopic.label}</div>
          <div style={{fontFamily:"'Crimson Pro',serif",fontSize:14,color:"#607D8B",marginBottom:32,fontStyle:"italic"}}>Vælg hvordan du vil arbejde med emnet</div>
          {selectedTopic.id==="quiz" ? (
            <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:360}}>
              <div style={{fontFamily:"'Crimson Pro',serif",fontSize:16,color:"#1A2332",marginBottom:4,textAlign:"center"}}>Vælg antal spørgsmål</div>
              {[5,10,20].map(n=>(
                <button key={n} onClick={()=>{setQuizCount(n);setTopicSubmode("quiz");const prompt=`Start en quiz om ${(TOPICS[role]||[]).find(t=>t.id!=="quiz")?.label||"faglige emner"} med præcis ${n} spørgsmål. Stil ét spørgsmål ad gangen og følg quiz-protokollen.`;hq(prompt);}}
                  style={{background:"#FFFFFF",border:`2px solid ${selectedTopic.color}`,borderRadius:12,padding:"16px",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:17,fontWeight:600,color:selectedTopic.color,transition:"all 0.2s"}}>
                  🧪 Quiz med {n} spørgsmål
                </button>
              ))}
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:360}}>
              {[
                {mode:"laer", icon:"📖", label:"Lær", desc:"Struktureret gennemgang af emnet"},
                {mode:"quiz", icon:"🧪", label:"Quiz", desc:"Test din viden med spørgsmål"},
                {mode:"spar", icon:"💬", label:"Spar", desc:"Fri dialog og sparring om emnet"},
              ].map(s=>(
                <button key={s.mode} onClick={()=>{
                  setTopicSubmode(s.mode);
                  const topicStr = (TOPIC_PROMPTS[selectedTopic.id]||{})[role] || (TOPIC_PROMPTS[selectedTopic.id]||{}).default || selectedTopic.label;
                  let prompt="";
                  if(s.mode==="laer") prompt=`Lav en struktureret og pædagogisk gennemgang af emnet: ${topicStr}. Start med det vigtigste og byg gradvist videre. Tilpas til min rolle som ${role}.`;
                  else if(s.mode==="quiz") prompt=`Start en quiz om ${topicStr} med 10 spørgsmål. Stil ét spørgsmål ad gangen og følg quiz-protokollen nøje.`;
                  else prompt=`Lad os sparre om emnet: ${topicStr}. Jeg er ${role} på Hertughaven. Hvad er de vigtigste ting at have styr på inden for dette område?`;
                  hq(prompt);
                }}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=selectedTopic.color;e.currentTarget.style.background=`${selectedTopic.color}08`;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=`${selectedTopic.color}30`;e.currentTarget.style.background="#FFFFFF";}}
                  style={{background:"#FFFFFF",border:`2px solid ${selectedTopic.color}30`,borderRadius:12,padding:"16px 20px",cursor:"pointer",textAlign:"left",transition:"all 0.2s",display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:28}}>{s.icon}</span>
                  <div>
                    <div style={{fontFamily:"'Crimson Pro',serif",fontSize:17,fontWeight:600,color:"#1A2332"}}>{s.label}</div>
                    <div style={{fontFamily:"'Crimson Pro',serif",fontSize:13,color:"#607D8B",marginTop:2}}>{s.desc}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Messages */}
      {messages.length>0&&(
      <div style={{flex:1,overflowY:"auto",padding:"22px 18px",maxWidth:800,width:"100%",margin:"0 auto"}}>
        {messages.map((m,i)=>(
          <div key={i} className={`mr ${m.role}`}>
            {m.role==="assistant"&&<div className="av">⚕️</div>}
            <div className={`mb ${m.role}`} dangerouslySetInnerHTML={{__html:fmt(m.content)}}/>
          </div>
        ))}
        {loading&&(
          <div className="mr assistant">
            <div className="av">⚕️</div>
            <div className="mb assistant" style={{padding:"14px 18px"}}><div className="dot"/><div className="dot"/><div className="dot"/></div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>
      )}

      {role&&messages.length>0&&(
        <div style={{maxWidth:800,width:"100%",margin:"0 auto",padding:"6px 18px",display:"flex",gap:7,alignItems:"center"}}>
          <button onClick={()=>{setMessages([]);setSelectedTopic(null);setTopicSubmode(null);setQuizCount(null);storage.set("hh_messages",[]);}} style={{background:"none",border:"1px solid #C8D6E2",color:"#78909C",borderRadius:20,padding:"5px 14px",cursor:"pointer",fontFamily:"'Crimson Pro',serif",fontSize:13}}>← Skift emne</button>
          {selectedTopic&&<span style={{fontSize:13,color:"#607D8B",fontFamily:"'Crimson Pro',serif",fontStyle:"italic"}}>{selectedTopic.icon} {selectedTopic.label}</span>}
        </div>
      )}

      {role&&(
        <div style={{borderTop:"1px solid #D0DAE4",padding:"14px 18px",maxWidth:800,width:"100%",margin:"0 auto"}}>
          <div style={{display:"flex",gap:9,alignItems:"flex-end"}}>
            <textarea ref={inputRef} className="ci" value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}
              placeholder="Skriv dit spørgsmål eller beskriv en situation..." rows={1} disabled={loading}/>
            <button className="sb" onClick={()=>sendMessage()} disabled={!input.trim()||loading}>↑</button>
          </div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#90A4AE",textAlign:"center",marginTop:7,letterSpacing:"0.05em"}}>ENTER for at sende · SHIFT+ENTER for linjeskift</div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
