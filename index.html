// ─── Storage ──────────────────────────────────────────────────────────────────

const storage = {
  get: (key, fallback = null) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  },
  set: (key, val) => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  },
};

function trackEvent(type, data = {}) {
  const events = storage.get("hh_events", []);
  events.push({ type, data, ts: Date.now(), date: new Date().toISOString().split("T")[0] });
  if (events.length > 2000) events.splice(0, events.length - 2000);
  storage.set("hh_events", events);
}

// ─── API ──────────────────────────────────────────────────────────────────────

async function callClaude(messages, role) {
  const systemPrompt = SYSTEM_PROMPT.replace("{ROLE}", role);
  const response = await fetch("https://holy-sound-c182.destinycomes2.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemPrompt,
      messages,
    }),
  });
  const data = await response.json();
  return data.content?.map(b => b.text || "").join("") || "Fejl: Intet svar modtaget.";
}

// ─── Depot helpers ────────────────────────────────────────────────────────────

const todayDate = new Date();
todayDate.setHours(0,0,0,0);

function isExpired(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < todayDate;
}

function isSoonExpiring(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const diff = (d - todayDate) / (1000 * 60 * 60 * 24);
  return diff >= 0 && diff <= 60;
}

function formatDate(d) {
  if (!d) return "–";
  return new Date(d).toLocaleDateString("da-DK", { day: "numeric", month: "short", year: "numeric" });
}

function initials(name) {
  return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

function competencyStatus(approved, expiry) {
  if (!approved) return "none";
  if (isExpired(expiry)) return "expired";
  if (isSoonExpiring(expiry)) return "soon";
  return "ok";
}

const STATUS_COLOR = { ok: "#2DD4A0", soon: "#F7884F", expired: "#F75454", none: "#3D5066" };
const STATUS_LABEL = { ok: "Godkendt", soon: "Udløber snart", expired: "Udløbet", none: "Ikke godkendt" };

function StatusBadge({ approved, expiry }) {
  const st = competencyStatus(approved, expiry);
  const c = STATUS_COLOR[st];
  return (

      background: c + "20", color: c, border: `1px solid ${c}40`, whiteSpace: "nowrap",
    }}>{STATUS_LABEL[st]}</span>
  );
}

// ─── Depot Edit Modal ─────────────────────────────────────────────────────────

function DepotEditModal({ staffMember, competencies, onSave, onClose }) {
  const [draft, setDraft] = useState(() => {
    const c = competencies[staffMember.id] || {};
    return DEPOT_DRUGS.reduce((acc, d) => {
      acc[d.id] = { approved: c[d.id]?.approved || false, expiry: c[d.id]?.expiry || "" };
      return acc;
    }, {});
  });

  const toggle = (drugId) => setDraft(prev => ({ ...prev, [drugId]: { ...prev[drugId], approved: !prev[drugId].approved } }));
  const setExpiry = (drugId, val) => setDraft(prev => ({ ...prev, [drugId]: { ...prev[drugId], expiry: val } }));

  const save = () => {
    const result = {};
    DEPOT_DRUGS.forEach(d => {
      if (draft[d.id].approved) result[d.id] = { approved: true, expiry: draft[d.id].expiry || null };
    });
    onSave(staffMember.id, result);
  };

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:400, backdropFilter:"blur(6px)" }}>
      <div style={{ background:"#0D1520", border:"1px solid #1A2030", borderRadius:16, padding:28, width:"min(540px,94vw)", maxHeight:"85vh", overflowY:"auto" }}>
        <div style={{ fontSize:18, fontWeight:600, color:"#E8E6E1", marginBottom:4 }}>Rediger kompetencer</div>
        <div style={{ fontSize:13, color:"#4A6080", marginBottom:20, fontFamily:"'JetBrains Mono',monospace" }}>{staffMember.name} · {staffMember.role}</div>

        {DEPOT_DRUGS.map(d => {
          const entry = draft[d.id];
          return (
            <div key={d.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 14px", borderRadius:8, marginBottom:8, background:"#161B22", border:`1px solid ${entry.approved?"#2D4A6E":"#1A2030"}` }}>
              <input type="checkbox" checked={entry.approved} onChange={() => toggle(d.id)} style={{ accentColor:"#58A6FF", width:16, height:16, flexShrink:0, cursor:"pointer" }} />
              <div style={{ flex:1 }}>
                <div style={{ fontSize:15, color:"#C9D1D9", fontWeight:entry.approved?600:400 }}>{d.name}</div>
                <div style={{ fontSize:11, color:"#4A6080", fontFamily:"'JetBrains Mono',monospace" }}>{d.generic}</div>
              </div>
              {entry.approved && (
                <input type="date" value={entry.expiry} onChange={e => setExpiry(d.id, e.target.value)}
                  style={{ background:"#080C10", border:"1px solid #2D4A6E", borderRadius:6, padding:"5px 9px", color:"#79C0FF", fontFamily:"'JetBrains Mono',monospace", fontSize:12, outline:"none" }} />
              )}
            </div>
          );
        })}

        <div style={{ display:"flex", gap:10, marginTop:20, justifyContent:"flex-end" }}>
          <button onClick={onClose} style={{ background:"none", border:"1px solid #1A2030", color:"#6E7681", borderRadius:8, padding:"9px 18px", cursor:"pointer", fontFamily:"'Crimson Pro',serif", fontSize:15 }}>Annuller</button>
          <button onClick={save} style={{ background:"#1D3557", border:"1px solid #2D4A6E", color:"#79C0FF", borderRadius:8, padding:"9px 20px", cursor:"pointer", fontFamily:"'Crimson Pro',serif", fontSize:15, fontWeight:600 }}>Gem</button>
        </div>
      </div>
    </div>
  );
}

// ─── Depot Staff View ─────────────────────────────────────────────────────────

  const getStats = (staffId) => {
    const comp = competencies[staffId] || {};
    let ok = 0, expired = 0, soon = 0;
    Object.values(comp).forEach(c => {
      if (!c.approved) return;
      const st = competencyStatus(c.approved, c.expiry);
      if (st === "ok") ok++; else if (st === "expired") expired++; else if (st === "soon") soon++;
    });
    return { ok, expired, soon };
  };

  return (
    <div style={{ display:"flex", height:"100%", minHeight:0 }}>
      {/* List */}
      <div style={{ width:240, flexShrink:0, borderRight:"1px solid #1A2030", overflowY:"auto", padding:"14px 10px" }}>

        {filtered.map(s => {
          const { ok, expired, soon } = getStats(s.id);
          const hasIssue = expired > 0 || soon > 0;
          const isSel = selected === s.id;
          return (
            <div key={s.id} onClick={() => setSelected(isSel ? null : s.id)}
              style={{ padding:"11px 12px", borderRadius:10, marginBottom:6, background:isSel?"#161B22":"#0D1520", border:`1px solid ${isSel?"#2D4A6E":"#1A2030"}`, cursor:"pointer" }}>
              <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                <div style={{ width:32, height:32, borderRadius:"50%", background:"#080C10", border:`1.5px solid ${isSel?"#58A6FF":"#1A2030"}`, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'JetBrains Mono',monospace", fontSize:11, fontWeight:600, color:"#58A6FF", flexShrink:0 }}>

                  <div style={{ fontSize:10, color:"#4A6080", fontFamily:"'JetBrains Mono',monospace" }}>{s.role}</div>
                </div>
              </div>
              <div style={{ marginTop:7, fontSize:11, fontFamily:"'JetBrains Mono',monospace", color:hasIssue?"#F7884F":"#2DD4A0" }}>
                {ok} godkendt{ok!==1?"e":""}{hasIssue?` · ${expired+soon} problem${expired+soon!==1?"er":""}`:""}</div>
            </div>
          );
        })}
      </div>

      {/* Detail */}
      <div style={{ flex:1, overflowY:"auto", padding:"22px 24px" }}>
        {!selectedMember ? (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", height:"100%", color:"#3D5066", fontStyle:"italic", fontSize:15, gap:10 }}>
            <div style={{ fontSize:32, opacity:0.3 }}>💉</div>
            Vælg en medarbejder for at se kompetencer

        ) : (
          <>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20, paddingBottom:18, borderBottom:"1px solid #1A2030" }}>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ width:44, height:44, borderRadius:"50%", background:"#080C10", border:"2px solid #58A6FF", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'JetBrains Mono',monospace", fontSize:15, fontWeight:600, color:"#58A6FF" }}>

function Dashboard({ onClose }) {
  const events = storage.get("hh_events", []);
  const sessions = events.filter(e => e.type==="session_start");
  const messages = events.filter(e => e.type==="message_sent");
  const topics = events.filter(e => e.type==="topic");

  const roleCount = {};
  ROLES.forEach(r => roleCount[r.id] = 0);
  sessions.forEach(e => { if (e.data.role) roleCount[e.data.role] = (roleCount[e.data.role]||0)+1; });

  const now = new Date();
  const days = Array.from({length:14},(_,i) => { const d=new Date(now); d.setDate(d.getDate()-(13-i)); return d.toISOString().split("T")[0]; });
  const msgPerDay = days.map(d => ({ date:d, label:new Date(d).toLocaleDateString("da-DK",{weekday:"short",day:"numeric"}), count:messages.filter(e=>e.date===d).length }));

  const topicCount = {};
  topics.forEach(e => { if (e.data.topic) topicCount[e.data.topic]=(topicCount[e.data.topic]||0)+1; });
  const topTopics = Object.entries(topicCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const totalSessions = sessions.length;
  const totalMessages = messages.length;
  const avgMsg = totalSessions ? (totalMessages/totalSessions).toFixed(1) : 0;
  const activeDays = days.slice(7).filter(d => messages.some(e=>e.date===d)).length;
  const maxDay = Math.max(...msgPerDay.map(d=>d.count),1);

  return (
    <div style={{ position:"fixed", inset:0, background:"#080C10", zIndex:300, overflowY:"auto", fontFamily:"'Crimson Pro',serif" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"18px 28px", borderBottom:"1px solid #1A2030", background:"#080C10", position:"sticky", top:0, zIndex:10 }}>
        <div>
          <div style={{ fontSize:20, fontWeight:600, color:"#E8E6E1" }}>⚕️ Hertughaven · Admin Dashboard</div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#3D5066", textTransform:"uppercase", letterSpacing:"0.1em", marginTop:2 }}>Sønderborg Kommune · Socialpsykiatri</div>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <button onClick={() => {
            const blob = new Blob([JSON.stringify({exportDate:new Date().toISOString(),totalSessions,totalMessages,roleCount,topTopics},null,2)],{type:"application/json"});
            const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`hertughaven-rapport-${new Date().toISOString().split("T")[0]}.json`; a.click();
          }} style={{ background:"#1D3557", border:"1px solid #2D4A6E", color:"#79C0FF", borderRadius:8, padding:"8px 16px", cursor:"pointer", fontFamily:"'Crimson Pro',serif", fontSize:14 }}>↓ Eksportér</button>
          <button onClick={onClose} style={{ background:"#0D1520", border:"1px solid #1A2030", color:"#8B949E", borderRadius:8, padding:"8px 16px", cursor:"pointer", fontFamily:"'Crimson Pro',serif", fontSize:14 }}>← Tilbage</button>
        </div>
      </div>

      <div style={{ padding:28, maxWidth:1000, margin:"0 auto" }}>
        {totalSessions===0 ? (
          <div style={{ textAlign:"center", padding:"60px 20px", color:"#3D5066", fontStyle:"italic" }}>Ingen data endnu. Data indsamles automatisk når medarbejdere bruger appen.</div>
        ) : (
          <>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:14, marginBottom:28 }}>
              {[{label:"Samtaler i alt",value:totalSessions,hint:"siden opstart"},{label:"Beskeder sendt",value:totalMessages,hint:"bruger + AI"},{label:"Pr. samtale",value:avgMsg,hint:"gennemsnit"},{label:"Aktive dage (7 dg)",value:`${activeDays}/7`,hint:"dage med aktivitet"}].map(s => (
                <div key={s.label} style={{ background:"#0D1520", border:"1px solid #1A2030", borderRadius:12, padding:"18px 20px" }}>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#3D5066", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8 }}>{s.label}</div>
                  <div style={{ fontSize:32, fontWeight:600, color:"#79C0FF", lineHeight:1 }}>{s.value}</div>
                  <div style={{ fontSize:13, color:"#4A6080", marginTop:4, fontStyle:"italic" }}>{s.hint}</div>
                </div>
              ))}
            </div>

            <div style={{ marginBottom:28 }}>
              <div style={{ fontSize:16, fontWeight:600, color:"#8B949E", marginBottom:14, paddingBottom:8, borderBottom:"1px solid #1A2030" }}>Aktivitet · Seneste 14 dage</div>
              <div style={{ background:"#0D1520", border:"1px solid #1A2030", borderRadius:12, padding:"20px 16px" }}>
                <div style={{ display:"flex", alignItems:"flex-end", gap:5, height:100 }}>
                  {msgPerDay.map(d => (
                    <div key={d.date} style={{ display:"flex", flexDirection:"column", alignItems:"center", flex:1, height:"100%", justifyContent:"flex-end" }}>
                      {d.count>0 && <div style={{ fontSize:10, color:"#79C0FF", marginBottom:3, fontFamily:"'JetBrains Mono',monospace" }}>{d.count}</div>}
                      <div style={{ width:"100%", borderRadius:"3px 3px 0 0", background:"linear-gradient(180deg,#3B82F6,#1D4ED8)", minHeight:2, height:`${(d.count/maxDay)*90}%` }} />

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, marginBottom:24 }}>

                <div style={{ background:"#0D1520", border:"1px solid #1A2030", borderRadius:12, padding:"14px 18px" }}>
                  {ROLES.map(r => {
                    const count = roleCount[r.id]||0;
                    const max = Math.max(...Object.values(roleCount),1);
                    return (
                      <div key={r.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:"1px solid #1A2030" }}>
                        <span style={{ fontSize:14 }}>{r.icon}</span>
                        <span style={{ fontSize:14, color:"#C9D1D9", width:100 }}>{r.id}</span>
                        <div style={{ flex:1, height:5, background:"#1A2030", borderRadius:3, overflow:"hidden" }}>
                          <div style={{ height:"100%", width:`${(count/max)*100}%`, background:"linear-gradient(90deg,#2D6A4F,#58A6FF)", borderRadius:3 }} />
                        </div>
                        <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:13, color:"#58A6FF", width:20, textAlign:"right" }}>{count}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div>
                <div style={{ fontSize:16, fontWeight:600, color:"#8B949E", marginBottom:14, paddingBottom:8, borderBottom:"1px solid #1A2030" }}>Mest efterspurgte emner</div>
                {topTopics.length===0 ? <div style={{ color:"#3D5066", fontStyle:"italic" }}>Emnedata indsamles fra genvejsknapper</div>
                  : topTopics.map(([topic,count]) => (
                    <div key={topic} style={{ display:"flex", justifyContent:"space-between", padding:"8px 12px", borderRadius:8, marginBottom:6, background:"#0D1520", border:"1px solid #1A2030" }}>
                      <span style={{ fontSize:14, color:"#C9D1D9" }}>{topic}</span>
                      <span style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12, background:"#1A2030", color:"#58A6FF", padding:"2px 8px", borderRadius:10 }}>{count}×</span>
                    </div>
                  ))
                }
              </div>
            </div>

            <div style={{ background:"#0D1520", border:"1px solid #1A2030", borderRadius:12, padding:"14px 18px", fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:"#3D5066", lineHeight:1.7 }}>
              <span style={{ color:"#4A6080" }}>ℹ️ GDPR-note:</span> Data gemmes lokalt i browseren. Ingen persondata eller samtaleindhold registreres.
            </div>
          </>
        )}
      </div>
    </div>
  );
}

        <div style={{ fontSize:14, color:"#6E7681", textAlign:"center", marginBottom:22, fontStyle:"italic" }}>Kun for daglig leder</div>

          style={{ width:"100%", background:"#080C10", border:`1px solid ${err?"#F85149":"#1A2030"}`, borderRadius:8, padding:"10px 14px", color:"#E8E6E1", fontFamily:"'Crimson Pro',serif", fontSize:16, outline:"none", marginBottom:err?8:14 }} />

        </div>

    </div>
  );
}

function App() {
  const [role, setRole] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [showRoleModal, setShowRoleModal] = useState(false);
  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const [showDashboard, setShowDashboard] = useState(false);
  const [showDepot, setShowDepot] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    const r = storage.get("hh_role");
    const m = storage.get("hh_messages");
    if (r) setRole(r);
    if (m) setMessages(m);
  }, []);

  useEffect(() => {
    if (role) { storage.set("hh_role", role); storage.set("hh_messages", messages); }
  }, [role, messages]);

  useEffect(() => { bottomRef.current?.scrollIntoView({behavior:"smooth"}); }, [messages, loading]);

  const selectRole = (r) => {
    setRole(r); setShowRoleModal(false);
    trackEvent("session_start", {role:r});
    setMessages([{ role:"assistant", content:`Velkommen, ${r}! 👋\n\nJeg er din faglige sparringspartner på **Hertughaven**. Jeg kender jeres arbejdsmetoder, sikkerhedsprocedurer, lovgivning og faglige udfordringer.\n\nDu kan:\n- 💬 **Sparre** om en konkret situation\n- 🧪 **Træne** med quiz og cases\n- 📋 **Få råd** om procedurer og lovgivning\n- 🔒 **Genopfriske** sikkerhedsregler (BVC, LA2, Sikkerhedstavlen)\n\nHvad kan jeg hjælpe dig med i dag?` }]);
  };

  const sendMessage = async (text) => {
    const userText = text || input.trim();
    if (!userText || loading) return;
    setInput("");
    trackEvent("message_sent", {role});
    const newMsgs = [...messages, {role:"user", content:userText}];
    setMessages(newMsgs);
    setLoading(true);
    try {
      const reply = await callClaude(newMsgs.map(m=>({role:m.role,content:m.content})), role);
      setMessages([...newMsgs, {role:"assistant", content:reply}]);
    } catch {
      setMessages([...newMsgs, {role:"assistant", content:"⚠️ Fejl ved forbindelse. Prøv igen."}]);
    }
    setLoading(false);
    setTimeout(() => inputRef.current?.focus(), 100);
  };

  const handleQuick = (a) => { trackEvent("topic",{topic:a,role}); sendMessage(a); };
  const clearHistory = () => { setMessages([]); storage.set("hh_messages",[]); if(role) selectRole(role); };

  const fmt = (text) => text
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/#{1,3} (.+)/g,'<span style="display:block;font-size:18px;font-weight:600;color:#E8E6E1;margin:8px 0 4px">$1</span>')
    .replace(/\n- /g,"\n• ")
    .replace(/\n/g,"<br/>");

  return (
    <div style={{ minHeight:"100vh", background:"#0D1117", display:"flex", flexDirection:"column", color:"#E8E6E1", fontFamily:"'Crimson Pro',serif" }}>
      <style>{`
        .app-header{background:#0D1117;border-bottom:1px solid #21262D;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
        .logo-badge{width:34px;height:34px;background:linear-gradient(135deg,#2D6A4F,#1D3557);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;}
        .role-pill{display:flex;align-items:center;gap:7px;background:#161B22;border:1px solid #30363D;border-radius:20px;padding:5px 13px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:14px;color:#C9D1D9;transition:all 0.2s;}
        .role-pill:hover{border-color:#58A6FF;color:#58A6FF;}
        .icon-btn{background:none;border:1px solid #30363D;color:#6E7681;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;}
        .icon-btn:hover{border-color:#58A6FF;color:#58A6FF;}
        .depot-btn{background:none;border:1px solid #2D4A6E;color:#4A7AAA;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;}
        .depot-btn:hover{border-color:#79C0FF;color:#79C0FF;background:#0D1520;}
        .admin-btn{background:none;border:1px solid #1A2030;color:#3D5066;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;}
        .admin-btn:hover{border-color:#4A6080;color:#6E7681;}
        .role-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
        .role-modal{background:#161B22;border:1px solid #30363D;border-radius:16px;padding:36px;max-width:460px;width:90%;animation:fadeUp 0.3s ease;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

        .chat-input:focus{border-color:#58A6FF;}
        .chat-input::placeholder{color:#6E7681;}
        .send-btn{background:#1D3557;border:1px solid #2D4A6E;color:#79C0FF;border-radius:10px;padding:11px 16px;cursor:pointer;font-size:18px;transition:all 0.2s;height:46px;display:flex;align-items:center;}
        .send-btn:hover:not(:disabled){background:#2D4A6E;}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed;}
      `}</style>

      {/* Role modal */}
      {(!role || showRoleModal) && (
        <div className="role-overlay">
          <div className="role-modal">
            <div style={{ textAlign:"center", fontSize:34, marginBottom:10 }}>⚕️</div>
            <div style={{ fontFamily:"'Crimson Pro',serif", fontSize:24, fontWeight:600, color:"#E8E6E1", textAlign:"center", marginBottom:6 }}>Hertughaven</div>
            <div style={{ fontFamily:"'Crimson Pro',serif", fontSize:14, color:"#8B949E", textAlign:"center", marginBottom:24, fontStyle:"italic" }}>Faglig sparringspartner · Sønderborg Kommune</div>
            {ROLES.map(r => (
              <button key={r.id} className="role-option" onClick={() => selectRole(r.id)}>
                <span style={{ fontSize:20 }}>{r.icon}</span>
                <span style={{ fontFamily:"'Crimson Pro',serif", fontSize:16, fontWeight:600, color:"#E8E6E1" }}>{r.label}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {showAdminLogin && <AdminLogin onSuccess={() => { setShowAdminLogin(false); setShowDashboard(true); }} onCancel={() => setShowAdminLogin(false)} />}
      {showDashboard && <Dashboard onClose={() => setShowDashboard(false)} />}
      {showDepot && <DepotModule onClose={() => setShowDepot(false)} />}

      {/* Header */}
      <div className="app-header">
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div className="logo-badge">⚕️</div>
          <div>
            <div style={{ fontFamily:"'Crimson Pro',serif", fontSize:18, fontWeight:600, color:"#E8E6E1" }}>Hertughaven</div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:"#6E7681", letterSpacing:"0.1em", textTransform:"uppercase" }}>Socialpsykiatri · Sønderborg</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:7 }}>
          {role && (
            <button className="role-pill" onClick={() => setShowRoleModal(true)}>
              <span>{ROLES.find(r=>r.id===role)?.icon}</span>
              <span>{role}</span>
            </button>
          )}
          <button className="depot-btn" onClick={() => setShowDepot(true)}>💉 Depot</button>
          <button className="icon-btn" onClick={clearHistory}>↺ Ny</button>
          <button className="admin-btn" onClick={() => setShowAdminLogin(true)}>⚙ Admin</button>
        </div>
      </div>

      {/* Messages */}
      <div style={{ flex:1, overflowY:"auto", padding:"22px 18px", maxWidth:800, width:"100%", margin:"0 auto" }}>
        {messages.length===0 && role && (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"60px 20px", textAlign:"center" }}>
            <div style={{ fontSize:44, marginBottom:14 }}>{ROLES.find(r=>r.id===role)?.icon}</div>
            <div style={{ fontFamily:"'Crimson Pro',serif", fontSize:21, fontWeight:600, color:"#E8E6E1", marginBottom:6 }}>Klar til at hjælpe, {role}</div>
            <div style={{ fontFamily:"'Crimson Pro',serif", fontSize:14, color:"#6E7681", fontStyle:"italic" }}>Stil et spørgsmål eller vælg en genvej nedenfor</div>
          </div>
        )}
        {messages.map((m,i) => (
          <div key={i} className={`msg-row ${m.role}`}>
            {m.role==="assistant" && <div className="avatar">⚕️</div>}
            <div className={`msg-bubble ${m.role}`} dangerouslySetInnerHTML={{__html:fmt(m.content)}} />
          </div>
        ))}
        {loading && (
          <div className="msg-row assistant">
            <div className="avatar">⚕️</div>
            <div className="msg-bubble assistant" style={{ padding:"14px 18px" }}>
              <div className="dot"/><div className="dot"/><div className="dot"/>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Quick actions */}
      {role && messages.length<=1 && (
        <div style={{ maxWidth:800, width:"100%", margin:"0 auto", padding:"0 18px 10px", display:"flex", gap:7, flexWrap:"wrap" }}>
          {(QUICK_ACTIONS[role]||[]).map(a => (
            <button key={a} className="quick-btn" onClick={() => handleQuick(a)}>{a}</button>
          ))}
        </div>
      )}

      {/* Input */}
      {role && (
        <div style={{ borderTop:"1px solid #21262D", padding:"14px 18px", maxWidth:800, width:"100%", margin:"0 auto" }}>
          <div style={{ display:"flex", gap:9, alignItems:"flex-end" }}>
            <textarea ref={inputRef} className="chat-input" value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}}
              placeholder="Skriv dit spørgsmål eller beskriv en situation..." rows={1} disabled={loading} />
            <button className="send-btn" onClick={() => sendMessage()} disabled={!input.trim()||loading}>↑</button>
          </div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:"#3D444D", textAlign:"center", marginTop:7, letterSpacing:"0.05em" }}>
            ENTER for at sende · SHIFT+ENTER for linjeskift
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
